name: Windows CW AutoContest Build

on:
  push:
    branches: ["work/build-v0.6.0"]
  pull_request:
    branches: ["main", "work/import-v0.5.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e '.[radio,audio]'
      - name: Run unit and Windows GUI tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
      - name: Build single-file Windows EXE
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1
      - name: Verify packaged runtime with no radio
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'cw-selfcheck.json'
          $p = Start-Process -FilePath '.\dist\IC7300_CW_AutoContest.exe' -ArgumentList @('--self-check-out', $output) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $output)) { throw 'Packaged runtime check failed' }
          $result = Get-Content -Raw $output | ConvertFrom-Json
          if ($result.transmitter_enabled -ne $false -or $result.cw_decoder_available -ne $true) { throw 'Unexpected runtime state' }
          Write-Host "Standalone EXE verified: $($result.application)"
      - uses: actions/upload-artifact@v4
        with:
          name: IC7300_CW_AutoContest_v0.6.0_Windows_x64
          path: dist/IC7300_CW_AutoContest.exe
          if-no-files-found: error
          retention-days: 30
